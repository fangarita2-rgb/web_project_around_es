<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Around the U.S.</title>
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          src="./images/logo.svg"
          alt="Logotipo Around the U.S."
          class="header__logo"
        />
      </header>

      <main class="content">
        <section class="profile page__section">
          <div class="profile__image-container">
            <img
              src="./images/avatar.jpg"
              alt="Fotografía de perfil de Jacques Cousteau"
              class="profile__image"
            />
            <button
              type="button"
              class="profile__avatar-button"
              aria-label="Editar foto de perfil"
            ></button>
          </div>
          <div class="profile__info">
            <div class="profile__title-container">
              <h1 class="profile__title">Jacques Cousteau</h1>
              <button
                type="button"
                class="profile__edit-button"
                aria-label="Editar perfil"
              ></button>
            </div>
            <p class="profile__description">Explorador</p>
          </div>
          <button
            type="button"
            class="profile__add-button"
            aria-label="Agregar nueva tarjeta"
          ></button>
        </section>

        <section class="cards page__section">
          <ul class="cards__list" id="cards-list"></ul>
        </section>
      </main>

      <footer class="footer page__section">
        <p class="footer__copyright">&copy; 2025 Around The U.S.</p>
      </footer>

      <!-- Popup: Editar Perfil -->
      <div class="popup" id="edit-popup">
        <div class="popup__content">
          <button
            type="button"
            class="popup__close"
            aria-label="Cerrar ventana emergente"
          ></button>
          <h2 class="popup__title">Editar perfil</h2>
          <form class="popup__form" id="edit-profile-form" novalidate>
            <input
              type="text"
              name="name"
              id="profile-name-input"
              class="popup__input"
              placeholder="Nombre"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="popup__error" id="profile-name-input-error"></span>
            <input
              type="text"
              name="description"
              id="profile-description-input"
              class="popup__input"
              placeholder="Acerca de mí"
              minlength="2"
              maxlength="200"
              required
            />
            <span
              class="popup__error"
              id="profile-description-input-error"
            ></span>
            <button type="submit" class="popup__button">Guardar</button>
          </form>
        </div>
      </div>

      <!-- Popup: Nueva Tarjeta -->
      <div class="popup" id="new-card-popup">
        <div class="popup__content">
          <button
            type="button"
            class="popup__close"
            aria-label="Cerrar ventana emergente"
          ></button>
          <h2 class="popup__title">Nuevo lugar</h2>
          <form class="popup__form" id="new-card-form" novalidate>
            <input
              type="text"
              name="place-name"
              id="card-title-input"
              class="popup__input"
              placeholder="Título"
              minlength="2"
              maxlength="30"
              required
            />
            <span class="popup__error" id="card-title-input-error"></span>
            <input
              type="url"
              name="link"
              id="card-url-input"
              class="popup__input"
              placeholder="Enlace a la imagen"
              required
            />
            <span class="popup__error" id="card-url-input-error"></span>
            <button type="submit" class="popup__button">Crear</button>
          </form>
        </div>
      </div>

      <!-- Popup: Editar Avatar -->
      <div class="popup" id="edit-avatar-popup">
        <div class="popup__content">
          <button
            type="button"
            class="popup__close"
            aria-label="Cerrar ventana emergente"
          ></button>
          <h2 class="popup__title">Actualizar foto de perfil</h2>
          <form class="popup__form" id="edit-avatar-form" novalidate>
            <input
              type="url"
              name="avatar"
              id="avatar-url-input"
              class="popup__input"
              placeholder="Enlace a la imagen"
              required
            />
            <span class="popup__error" id="avatar-url-input-error"></span>
            <button type="submit" class="popup__button">Guardar</button>
          </form>
        </div>
      </div>

      <!-- Popup: Confirmar Eliminación -->
      <div class="popup" id="confirm-delete-popup">
        <div class="popup__content">
          <button
            type="button"
            class="popup__close"
            aria-label="Cerrar ventana emergente"
          ></button>
          <h2 class="popup__title">¿Estás seguro?</h2>
          <form class="popup__form" id="confirm-delete-form">
            <button type="submit" class="popup__button">Sí</button>
          </form>
        </div>
      </div>

      <!-- Popup: Ver Imagen Ampliada -->
      <div class="popup" id="image-popup">
        <div class="popup__content popup__content_content_image">
          <button
            type="button"
            class="popup__close"
            aria-label="Cerrar ventana emergente"
          ></button>
          <img src="#" alt="" class="popup__image" />
          <p class="popup__caption"></p>
        </div>
      </div>
    </div>

    <!-- Template para las tarjetas -->
    <template id="card-template">
      <li class="card">
        <button
          type="button"
          class="card__delete-button"
          aria-label="Eliminar tarjeta"
        ></button>
        <img src="#" alt="" class="card__image" />
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button
            type="button"
            class="card__like-button"
            aria-label="Me gusta"
          ></button>
        </div>
      </li>
    </template>

    <script type="module" src="./public/index.js"></script>
  </body>
</html>
